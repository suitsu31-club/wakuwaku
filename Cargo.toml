[package]
name = "wakuwaku"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0"
anyhow = "1"
kanau = { version = "0.5", features = ["message"] }
amqprs = { version = "2.1", optional = true }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "time",
    "derive",
    "macros",
    "uuid",
    "rust_decimal",
    "json",
], optional = true }
uuid = { version = "1", optional = true }
redis = { version = "1.0", features = ["tokio-comp", "uuid", "json"], optional = true }
tonic = { version = "*", optional = true }
crossbeam-queue = "0.3"
tokio = "1"
tracing = { version = "0.1", optional = true }
time = "0.3"

[features]
default = ["amqprs", "sqlx", "redis", "uuid", "tracing"]
tracing-optl = ["tracing"]