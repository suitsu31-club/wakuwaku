[package]
name = "wakuwaku-entity"
version = "0.3.0"
description = "Capability-typed queries, hooks and transaction flows over sqlx, Redis and Meilisearch"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
kanau.workspace = true
thiserror = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio"], optional = true }
either = { version = "1.15", optional = true }
redis = { version = "1.0", default-features = false, features = ["tokio-comp", "script"], optional = true }
blake3 = { version = "1.8", optional = true }
getrandom = { version = "0.4", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
meilisearch-sdk = { version = "0.33", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
time = { version = "0.3", optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
default = ["sqlx-pg"]
sqlx-pg = ["dep:sqlx", "dep:either", "sqlx/postgres"]
sqlx-mysql = ["dep:sqlx", "dep:either", "sqlx/mysql"]
redis = ["dep:redis", "dep:blake3", "dep:getrandom", "dep:futures-util"]
meilisearch = ["dep:meilisearch-sdk", "dep:serde", "dep:serde_json", "dep:time"]

[package.metadata.docs.rs]
all-features = true
