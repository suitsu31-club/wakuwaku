[package]
name = "wakuwaku-entity"
version = "0.1.0"
description = "Capability-typed queries, hooks and pure transaction flows over sqlx and Redis"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
kanau.workspace = true
thiserror = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio"], optional = true }
redis = { version = "1.0", default-features = false, features = ["tokio-comp", "script"], optional = true }
blake3 = { version = "1.8", optional = true }
getrandom = { version = "0.4", optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
default = ["sqlx-pg"]
sqlx-pg = ["dep:sqlx", "sqlx/postgres"]
sqlx-mysql = ["dep:sqlx", "sqlx/mysql"]
redis = ["dep:redis", "dep:blake3", "dep:getrandom"]

[package.metadata.docs.rs]
all-features = true
